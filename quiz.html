<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Check | Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main-nav">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="topic1.html">The Past</a></li>
                <li><a href="topic2.html">The Present</a></li>
                <li><a href="quiz.html" class="active-link">Quiz</a></li>
                <li><a href="concepts.html">Concepts</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="card">
        <h2>Self-Assessment Quiz</h2>
        <form id="quizForm">
            <div class="q-box" style="margin-bottom: 20px;">
                <p>1. In the 1990s, developers used HTML _______ to create grids.</p>
                <input type="text" id="ans1" placeholder="Type here...">
            </div>

            <div class="q-box" style="margin-bottom: 20px;">
                <p>2. What was the bandwidth limit for most 1999 users?</p>
                <input type="radio" name="q2" value="dialup"> Dial-up (56kbps)<br>
                <input type="radio" name="q2" value="fiber"> Fiber Optics
            </div>

            <button type="button" onclick="gradeQuiz()" style="padding: 10px 20px; background: var(--accent); color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">Submit Quiz</button>
        </form>

        <div id="quizResults" style="display:none; margin-top:30px; padding:20px; border:1px solid var(--accent); border-radius:8px;">
            <h3 id="passFail"></h3> 
            <p id="finalScore"></p> 
            <div id="details"></div>
        </div>
    </main>
    <script src="quiz.js"></script>
</body>
</html>
